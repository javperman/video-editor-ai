[project]
name = "video-editor-ai"
version = "0.1.0"
description = "Edición automática de tutoriales técnicos desde un edit_plan.json"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "jsonpatch>=1.33",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2",
  "numpy>=1.26",
]
asr-cuda = [
  "faster-whisper>=1.2",
  "numpy>=1.26",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
]
vision = [
  "rapidocr-onnxruntime>=1.2",
  "numpy>=1.26",
]
providers = [
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["video_ai"]
